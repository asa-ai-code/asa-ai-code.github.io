<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使えるツール置き場</title>
<meta name="description" content="制度や計算まわりの、地味だけど必要になるツールを置いています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #18181b; --muted: #71717a;
    --card: #ffffff; --accent: #2563eb; --border: #e4e4e7;
    --shadow: 0 1px 2px rgba(24,24,27,.04), 0 8px 24px rgba(24,24,27,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d; --fg: #f4f4f5; --muted: #a1a1aa;
      --card: #18181b; --accent: #60a5fa; --border: #2a2a2e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; justify-content: center;
    padding: 48px 16px 80px; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 1.4rem; font-weight: 900; margin: 0 0 6px; }
  .lead { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
  a.tool {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--border);
    box-shadow: var(--shadow); border-radius: 14px;
    padding: 18px; margin-bottom: 12px;
    transition: border-color .15s ease;
  }
  a.tool:hover { border-color: var(--accent); }
  a.tool .name { font-weight: 900; font-size: 1rem; margin-bottom: 4px; }
  a.tool .desc { color: var(--muted); font-size: 0.85rem; }
  footer { margin-top: 40px; font-size: 0.72rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>使えるツール置き場</h1>
  <p class="lead">制度や計算まわりの、地味だけど必要になるツールを置いています。</p>

  <a class="tool" href="./shaho-2026/">
    <div class="name">106万円の壁 撤廃チェッカー</div>
    <div class="desc">2026年10月の改正で、自分が新たに社会保険の加入対象になるかを判定します。</div>
  </a>

  <footer>掲載内容は各ページ記載時点の公表情報にもとづく目安です。</footer>
</div>
</body>
</html>
